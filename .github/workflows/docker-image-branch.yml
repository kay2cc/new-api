name: Publish AIRP Docker image

on:
  push:
    branches: [codex/airp-dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: airp-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'kay2cc/new-api' && github.ref == 'refs/heads/codex/airp-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare version
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:12}"
          VERSION="v1.0.0-rc.51-mail.${SHORT_SHA}"
          echo "$VERSION" > VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/kay2cc/new-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:airp-dev
          labels: |
            org.opencontainers.image.source=https://github.com/kay2cc/new-api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record release image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### AIRP release image"
            echo "Version: $VERSION"
            echo "Commit: $GITHUB_SHA"
            echo "Image: $IMAGE@$DIGEST"
            echo "Platform: linux/amd64"
            echo "Integration tests skipped at the owner's request."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE_IMAGE=$IMAGE@$DIGEST"
